[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "relconv"
version = "0.1.0"
description = "Rule-based JSON <-> object engine with relational mapping, encrypted IDs, RDBMS CRUD sync and schema memory (no AI)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["json", "orm", "relational", "schema", "supabase", "postgres", "fastapi"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Typing :: Typed",
]
dependencies = ["cryptography>=41"]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
supabase = ["supabase>=2.0"]
rest = ["requests>=2.31"]
api = ["fastapi>=0.110", "pyjwt>=2.8", "requests>=2.31", "uvicorn>=0.27", "websockets>=12"]
dev = ["pytest>=8", "httpx>=0.27", "fastapi>=0.110", "pyjwt>=2.8", "requests>=2.31", "websockets>=12"]
all = ["relconv[postgres,supabase,rest,api]"]

[tool.setuptools.packages.find]
where = ["."]
include = ["relconv*"]

[tool.setuptools.package-data]
relconv = ["py.typed", "*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
